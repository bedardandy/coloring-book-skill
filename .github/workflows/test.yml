name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps (ghostscript for PDF merge)
        run: sudo apt-get update && sudo apt-get install -y ghostscript libcairo2-dev
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Fast tests (deterministic, no raster QA)
        run: pytest -q -m "not slow"
      - name: Full example book build + validation
        if: github.event_name != 'pull_request'
        run: pytest -q -m slow
